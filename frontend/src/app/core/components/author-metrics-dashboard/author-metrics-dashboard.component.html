@if (hasValidUrl()) {
  <iframe
    class="w-full h-full rounded-xl border-0"
    [src]="lookerStudioUrl()!"
    allowfullscreen
    sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
  ></iframe>
} @else {
<div
  class="flex flex-col items-center justify-center p-8 bg-yellow-500/10 border border-yellow-500/30 rounded-lg"
>
  <span class="material-icons text-yellow-400 text-4xl mb-2">info</span>
  <p class="text-yellow-300 text-sm font-medium text-center">
    Dashboard do Looker Studio não configurado para o autor ID {{ authorId }}
  </p>
  <p class="text-yellow-400/80 text-xs mt-1 text-center">
    Entre em contato com o administrador para configurar.
  </p>
</div>
}
