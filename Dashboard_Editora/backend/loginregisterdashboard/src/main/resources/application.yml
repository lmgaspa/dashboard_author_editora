spring:
  application:
    name: ${APPLICATION_NAME}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loginregisterdashboardeditora}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    repositories:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.data.jpa: info
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

brand:
  name: "Dashboard Autor Editora VL"
  frontend-url: "https://www.dashboard-author-editora.vercel.app"
  logo-url: "https://www.andescoresoftware.com.br" # troque aqui quando quiser

google:
  oauth:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}  # defina true no Heroku quando quiser ativar
    client-id: ${GOOGLE_CLIENT_ID}

application:
  jwt:
    secret: ${JWT_SECRET}
  brand:
    name: ${BRAND_NAME}
    logo-url: "https://www.andescoresoftware.com.br/AndesCore.jpg"
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://www.dashboard-author-editora.vercel.app}
  confirmation:
    minutes: 45            # expiração do token
    cooldown-seconds: 60   # intervalo mínimo entre reenvios
    max-per-day: 5         # teto diário por dia
  admin:
    # Variáveis de ambiente obrigatórias - não coloque valores padrão sensíveis aqui!
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    id: ${ADMIN_ID:admin-1}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    display-request-duration: true
    try-it-out-enabled: true
