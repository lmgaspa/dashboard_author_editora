<div class="min-h-screen w-full relative overflow-hidden bg-transition flex items-center justify-center p-8"
     [ngClass]="{
       'bg-weak': colorIntensity() === 'weak',
       'bg-medium': colorIntensity() === 'medium',
       'bg-strong': colorIntensity() === 'strong'
     }">
  
  <!-- Animated Background Orbs - Azul Marinho para Azul Celeste para Branco (3 segundos) -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <!-- Orb 1 - Top Left -->
    <div class="absolute rounded-full bg-gradient-radial blur-[120px] animate-float animate-color-transition"
         style="width: 500px; height: 500px; top: -250px; left: -250px; animation-delay: 0s;"></div>
    
    <!-- Orb 2 - Center Right -->
    <div class="absolute rounded-full bg-gradient-radial blur-[120px] animate-float animate-color-transition"
         style="width: 450px; height: 450px; top: 50%; right: 25%; transform: translateY(-50%); animation-delay: -5s;"></div>
    
    <!-- Orb 3 - Bottom Right -->
    <div class="absolute rounded-full bg-gradient-radial blur-[120px] animate-float animate-color-transition"
         style="width: 480px; height: 480px; bottom: -240px; right: -240px; animation-delay: -10s;"></div>
  </div>

  <!-- Grid Pattern Overlay - Intensidade Progressiva -->
  <div class="absolute inset-0 pointer-events-none transition-opacity duration-1000 ease-in-out"
       [ngClass]="{
         'opacity-[0.03]': colorIntensity() === 'weak',
         'opacity-[0.05]': colorIntensity() === 'medium',
         'opacity-[0.08]': colorIntensity() === 'strong'
       }"
       style="background-image: linear-gradient(rgba(125, 211, 252, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(125, 211, 252, 0.2) 1px, transparent 1px); background-size: 50px 50px;"></div>

  <div class="bg-[rgba(15,23,42,0.9)] backdrop-blur-xl rounded-3xl p-12 w-full max-w-[440px] shadow-[0_20px_60px_rgba(0,0,0,0.5)] border border-white/10 relative z-10">
    <h1 class="text-3xl font-bold text-white mb-4 text-center">Recuperar Senha</h1>
    <p class="text-gray-300 text-center mb-8">Digite seu email para receber instruções de recuperação de senha.</p>

    @if (success()) {
      <div class="flex gap-4 p-6 bg-green-500/10 border border-green-500/30 rounded-xl text-green-300 mb-6">
        <span class="material-icons text-4xl text-green-400">check_circle</span>
        <div>
          <strong class="block mb-1 text-base">Email enviado!</strong>
          <p class="text-sm opacity-90">Verifique sua caixa de entrada e siga as instruções.</p>
        </div>
      </div>
    } @else {
      @if (error()) {
        <div class="flex items-center gap-2 p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-300 mb-6 text-sm">
          <span class="material-icons text-xl">error_outline</span>
          <span>{{ error() }}</span>
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
        <div class="flex flex-col gap-2">
          <label for="email" class="text-sm font-semibold text-gray-200">E-mail</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="seuemail@gmail.com"
            class="w-full px-4 py-3.5 bg-white/5 border border-white/10 rounded-xl text-white text-base transition-all duration-200 focus:outline-none focus:border-blue-600 focus:bg-white/[0.08] focus:ring-4 focus:ring-blue-600/20 placeholder:text-white/40"
          />
        </div>

        <button
          type="submit"
          class="w-full px-6 py-3.5 bg-gradient-to-r from-sky-500 via-blue-600 to-sky-500 text-white border-none rounded-xl text-base font-semibold cursor-pointer transition-all duration-200 flex items-center justify-center gap-2 hover:-translate-y-0.5 hover:shadow-[0_10px_25px_rgba(14,165,233,0.5)] active:translate-y-0 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0"
          [disabled]="form.invalid || loading()"
        >
          @if (loading()) {
            <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            <span>Enviando...</span>
          } @else {
            <span>Enviar</span>
          }
        </button>
      </form>
    }

    <div class="mt-6 text-center">
      <a [routerLink]="['/login']" class="text-sm text-blue-400 no-underline transition-colors duration-200 hover:text-blue-300 hover:underline">Voltar ao login</a>
    </div>
  </div>
</div>
