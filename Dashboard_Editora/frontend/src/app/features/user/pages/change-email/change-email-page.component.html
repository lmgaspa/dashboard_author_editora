<div class="max-w-[600px] mx-auto">
  <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold mb-4 sm:mb-6 bg-gradient-to-r from-red-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">Alterar Email</h1>

  @if (success()) {
    <div class="flex items-center gap-2 sm:gap-3 p-3 sm:p-4 bg-green-500/10 border border-green-500/30 rounded-lg text-green-300 mb-4 sm:mb-6">
      <span class="material-icons text-lg sm:text-xl">check_circle</span>
      <span class="text-sm sm:text-base">Email alterado com sucesso!</span>
    </div>
  }

  @if (error()) {
    <div class="flex items-center gap-2 sm:gap-3 p-3 sm:p-4 bg-red-500/10 border border-red-500/30 rounded-lg text-red-300 mb-4 sm:mb-6">
      <span class="material-icons text-lg sm:text-xl">error_outline</span>
      <span class="text-sm sm:text-base">{{ error() }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-6 sm:mt-8 flex flex-col gap-4 sm:gap-6">
    <div class="flex flex-col gap-2">
      <label for="email" class="font-semibold text-gray-200 text-xs sm:text-sm">Novo E-mail</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="px-3 sm:px-4 py-2.5 sm:py-3 border border-white/10 rounded-lg sm:rounded-xl bg-white/5 text-white text-sm sm:text-base focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-500/20 placeholder:text-white/40"
        placeholder="novo@email.com"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="password" class="font-semibold text-gray-200 text-xs sm:text-sm">Senha Atual</label>
      <div class="relative">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          id="password"
          formControlName="password"
          class="w-full px-3 sm:px-4 py-2.5 sm:py-3 border border-white/10 rounded-lg sm:rounded-xl bg-white/5 text-white text-sm sm:text-base focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-500/20 placeholder:text-white/40 pr-10 sm:pr-12"
        />
        <button
          type="button"
          class="absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 bg-transparent border-none text-white/60 cursor-pointer p-1.5 sm:p-2 flex items-center justify-center transition-colors duration-200 hover:text-white/90"
          (click)="togglePassword()"
        >
          <span class="material-icons text-lg sm:text-xl">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
      <small class="text-gray-400 text-xs sm:text-sm">Digite sua senha atual para confirmar a alteração</small>
    </div>

    <button
      type="submit"
      class="px-4 sm:px-6 py-2.5 sm:py-3 bg-gradient-to-r from-sky-500 via-blue-600 to-sky-500 text-white border-none rounded-lg sm:rounded-xl font-semibold cursor-pointer transition-all duration-200 flex items-center justify-center gap-2 hover:shadow-[0_0_20px_rgba(14,165,233,0.5)] hover:-translate-y-0.5 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0 text-sm sm:text-base"
      [disabled]="form.invalid || loading()"
    >
      @if (loading()) {
        <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        <span>Alterando...</span>
      } @else {
        <span>Alterar Email</span>
      }
    </button>
  </form>
</div>
