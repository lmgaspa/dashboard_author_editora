<div class="change-password-page">
  <h1>Alterar Senha</h1>

  @if (success()) {
    <div class="success-message">
      <span class="material-icons">check_circle</span>
      <span>Senha alterada com sucesso!</span>
    </div>
  }

  @if (error()) {
    <div class="error-message">
      <span class="material-icons">error_outline</span>
      <span>{{ error() }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
    <div class="form-group">
      <label for="currentPassword">Senha Atual</label>
      <div class="password-input-wrapper">
        <input
          [type]="showCurrentPassword() ? 'text' : 'password'"
          id="currentPassword"
          formControlName="currentPassword"
          class="form-input"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="toggleCurrentPassword()"
        >
          <span class="material-icons">{{ showCurrentPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label for="newPassword">Nova Senha</label>
      <div class="password-input-wrapper">
        <input
          [type]="showNewPassword() ? 'text' : 'password'"
          id="newPassword"
          formControlName="newPassword"
          class="form-input"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="toggleNewPassword()"
        >
          <span class="material-icons">{{ showNewPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar Nova Senha</label>
      <div class="password-input-wrapper">
        <input
          [type]="showConfirmPassword() ? 'text' : 'password'"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="form-input"
        />
        <button
          type="button"
          class="password-toggle"
          (click)="toggleConfirmPassword()"
        >
          <span class="material-icons">{{ showConfirmPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
      @if (form.get('confirmPassword')?.hasError('passwordMismatch') && form.get('confirmPassword')?.touched) {
        <span class="error-text">As senhas não coincidem</span>
      }
    </div>

    <button
      type="submit"
      class="submit-button"
      [disabled]="form.invalid || loading()"
    >
      @if (loading()) {
        <span class="spinner"></span>
        <span>Alterando...</span>
      } @else {
        <span>Alterar Senha</span>
      }
    </button>
  </form>
</div>
