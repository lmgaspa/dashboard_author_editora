<div class="max-w-[600px]">
  <h1 class="text-3xl font-bold mb-6 bg-gradient-to-r from-red-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">Alterar Senha</h1>

  @if (success()) {
    <div class="flex items-center gap-2 p-4 bg-green-500/10 border border-green-500/30 rounded-lg text-green-300 mb-6">
      <span class="material-icons">check_circle</span>
      <span>Senha alterada com sucesso!</span>
    </div>
  }

  @if (error()) {
    <div class="flex items-center gap-2 p-4 bg-red-500/10 border border-red-500/30 rounded-lg text-red-300 mb-6">
      <span class="material-icons">error_outline</span>
      <span>{{ error() }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-8 flex flex-col gap-6">
    <div class="flex flex-col gap-2">
      <label for="currentPassword" class="font-semibold text-gray-200">Senha Atual</label>
      <div class="relative">
        <input
          [type]="showCurrentPassword() ? 'text' : 'password'"
          id="currentPassword"
          formControlName="currentPassword"
          class="w-full px-3 py-3 border border-white/10 rounded-lg bg-white/5 text-white text-base focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-500/20 placeholder:text-white/40 pr-12"
        />
        <button
          type="button"
          class="absolute right-3 top-1/2 -translate-y-1/2 bg-transparent border-none text-white/60 cursor-pointer p-2 flex items-center justify-center transition-colors duration-200 hover:text-white/90"
          (click)="toggleCurrentPassword()"
        >
          <span class="material-icons text-xl">{{ showCurrentPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label for="newPassword" class="font-semibold text-gray-200">Nova Senha</label>
      <div class="relative">
        <input
          [type]="showNewPassword() ? 'text' : 'password'"
          id="newPassword"
          formControlName="newPassword"
          class="w-full px-3 py-3 border border-white/10 rounded-lg bg-white/5 text-white text-base focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-500/20 placeholder:text-white/40 pr-12"
        />
        <button
          type="button"
          class="absolute right-3 top-1/2 -translate-y-1/2 bg-transparent border-none text-white/60 cursor-pointer p-2 flex items-center justify-center transition-colors duration-200 hover:text-white/90"
          (click)="toggleNewPassword()"
        >
          <span class="material-icons text-xl">{{ showNewPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label for="confirmPassword" class="font-semibold text-gray-200">Confirmar Nova Senha</label>
      <div class="relative">
        <input
          [type]="showConfirmPassword() ? 'text' : 'password'"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="w-full px-3 py-3 border border-white/10 rounded-lg bg-white/5 text-white text-base focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-500/20 placeholder:text-white/40 pr-12"
        />
        <button
          type="button"
          class="absolute right-3 top-1/2 -translate-y-1/2 bg-transparent border-none text-white/60 cursor-pointer p-2 flex items-center justify-center transition-colors duration-200 hover:text-white/90"
          (click)="toggleConfirmPassword()"
        >
          <span class="material-icons text-xl">{{ showConfirmPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
      @if (form.get('confirmPassword')?.hasError('passwordMismatch') && form.get('confirmPassword')?.touched) {
        <span class="text-xs text-red-400">As senhas não coincidem</span>
      }
    </div>

    <button
      type="submit"
      class="px-6 py-3 bg-gradient-to-r from-sky-500 via-blue-600 to-sky-500 text-white border-none rounded-lg font-semibold cursor-pointer transition-all duration-200 flex items-center justify-center gap-2 hover:shadow-[0_0_20px_rgba(14,165,233,0.5)] hover:-translate-y-0.5 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0"
      [disabled]="form.invalid || loading()"
    >
      @if (loading()) {
        <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        <span>Alterando...</span>
      } @else {
        <span>Alterar Senha</span>
      }
    </button>
  </form>
</div>
