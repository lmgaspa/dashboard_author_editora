<div class="w-full sm:max-w-[600px] sm:mx-auto space-y-4 sm:space-y-6">
  <!-- Título -->
  <h1 class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold mb-3 sm:mb-4 md:mb-6 bg-gradient-to-r from-red-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">Meu Perfil</h1>

  <!-- Mensagem de Sucesso -->
  @if (success()) {
    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2 sm:gap-3 p-3 sm:p-4 bg-green-500/10 border border-green-500/30 rounded-lg text-green-300">
      <span class="material-icons text-xl flex-shrink-0">check_circle</span>
      <span class="text-sm sm:text-base">Perfil atualizado com sucesso!</span>
    </div>
  }

  <!-- Mensagem de Erro -->
  @if (error()) {
    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2 sm:gap-3 p-3 sm:p-4 bg-red-500/10 border border-red-500/30 rounded-lg text-red-300">
      <span class="material-icons text-xl flex-shrink-0">error_outline</span>
      <span class="text-sm sm:text-base break-words">{{ error() }}</span>
    </div>
  }

  <!-- Formulário -->
  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 sm:gap-6">
    <!-- Campo Nome -->
    <div class="flex flex-col gap-2">
      <label for="name" class="font-semibold text-gray-200 text-sm">Nome</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="w-full px-4 py-3 border border-white/10 rounded-lg bg-white/5 text-white text-base focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-500/20 placeholder:text-white/40"
        placeholder="Seu nome completo"
      />
    </div>

    <!-- Campo Email -->
    <div class="flex flex-col gap-2">
      <label for="email" class="font-semibold text-gray-200 text-sm">E-mail</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="w-full px-4 py-3 border border-white/10 rounded-lg bg-white/5 text-white text-base opacity-60 cursor-not-allowed"
        readonly
      />
      <small class="text-gray-400 text-xs sm:text-sm break-words">Para alterar o email, use a opção "Alterar Email" no menu.</small>
    </div>

    <!-- Botão Salvar -->
    <button
      type="submit"
      class="w-full sm:w-auto sm:min-w-[200px] px-6 py-3 bg-gradient-to-r from-sky-500 via-blue-600 to-sky-500 text-white border-none rounded-lg font-semibold cursor-pointer transition-all duration-200 flex items-center justify-center gap-2 hover:shadow-[0_0_20px_rgba(14,165,233,0.5)] hover:-translate-y-0.5 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0 text-base"
      [disabled]="profileForm.invalid || loading()"
    >
      @if (loading()) {
        <span class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        <span>Salvando...</span>
      } @else {
        <span>Salvar Alterações</span>
      }
    </button>
  </form>
</div>
