<div class="max-w-[600px]">
  <h1 class="text-3xl font-bold mb-6 bg-gradient-to-r from-red-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">Meu Perfil</h1>

  @if (success()) {
    <div class="flex items-center gap-2 p-4 bg-green-500/10 border border-green-500/30 rounded-lg text-green-300 mb-6">
      <span class="material-icons">check_circle</span>
      <span>Perfil atualizado com sucesso!</span>
    </div>
  }

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="mt-8 flex flex-col gap-6">
    <div class="flex flex-col gap-2">
      <label for="name" class="font-semibold text-gray-200">Nome</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="px-3 py-3 border border-white/10 rounded-lg bg-white/5 text-white text-base focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-500/20 placeholder:text-white/40"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="email" class="font-semibold text-gray-200">E-mail</label>
      <input
        type="email"
        id="email"
        formControlName="email"
        class="px-3 py-3 border border-white/10 rounded-lg bg-white/5 text-white text-base opacity-60 cursor-not-allowed"
        [disabled]="true"
      />
      <small class="text-gray-400 text-sm">Para alterar o email, use a opção "Alterar Email" no menu.</small>
    </div>

    <button
      type="submit"
      class="px-6 py-3 bg-gradient-to-r from-sky-500 via-blue-600 to-sky-500 text-white border-none rounded-lg font-semibold cursor-pointer transition-all duration-200 flex items-center justify-center gap-2 hover:shadow-[0_0_20px_rgba(14,165,233,0.5)] hover:-translate-y-0.5 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0"
      [disabled]="profileForm.invalid || loading()"
    >
      @if (loading()) {
        <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        <span>Salvando...</span>
      } @else {
        <span>Salvar Alterações</span>
      }
    </button>
  </form>
</div>
