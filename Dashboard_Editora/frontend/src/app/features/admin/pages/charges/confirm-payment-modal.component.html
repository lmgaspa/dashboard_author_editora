@if (isOpen() && charge()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" (click)="close()">
    <div class="bg-[rgba(15,23,42,0.95)] border border-white/20 rounded-xl shadow-xl max-w-md w-full p-6 space-y-4" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h3 class="text-xl font-bold text-gray-200">Confirmar Pagamento</h3>
        <button
          type="button"
          class="text-gray-400 hover:text-gray-200 transition-colors"
          (click)="close()"
          [disabled]="loading()"
        >
          <span class="material-icons">close</span>
        </button>
      </div>

      @if (error()) {
        <div class="bg-red-500/10 border border-red-500/30 rounded-lg p-4">
          <p class="text-red-300 text-sm">{{ error() }}</p>
        </div>
      }

      <div class="space-y-4">
        <div class="bg-white/5 border border-white/10 rounded-lg p-4 space-y-2">
          <div class="flex justify-between">
            <span class="text-gray-400 text-sm">Autor:</span>
            <span class="text-gray-300 font-medium">{{ charge()!.authorName }}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-400 text-sm">Mês/Ano:</span>
            <span class="text-gray-300 font-medium">{{ formatMonthYear(charge()!.chargeMonth, charge()!.chargeYear) }}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-400 text-sm">Valor:</span>
            <span class="text-gray-300 font-bold text-lg">{{ formatCurrency(charge()!.amount) }}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-400 text-sm">Vencimento:</span>
            <span class="text-gray-300 font-medium">{{ formatDate(charge()!.dueDate) }}</span>
          </div>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Notas (opcional)
            </label>
            <textarea
              formControlName="notes"
              rows="3"
              placeholder="Adicione notas sobre o pagamento..."
              class="w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-lg text-gray-300 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500/50 transition-all duration-200 resize-none"
            ></textarea>
          </div>

          <div class="flex items-center justify-end gap-3 pt-4 border-t border-white/10">
            <button
              type="button"
              class="px-4 py-2.5 bg-gray-500/20 hover:bg-gray-500/30 border border-gray-500/30 rounded-lg text-gray-300 font-medium transition-colors duration-200"
              (click)="close()"
              [disabled]="loading()"
            >
              Cancelar
            </button>
            <button
              type="submit"
              class="px-4 py-2.5 bg-green-500/20 hover:bg-green-500/30 border border-green-500/30 rounded-lg text-green-300 font-medium transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
              [disabled]="loading()"
            >
              @if (loading()) {
                <span class="flex items-center gap-2">
                  <span class="w-4 h-4 border-2 border-green-300/30 border-t-green-300 rounded-full animate-spin"></span>
                  Confirmando...
                </span>
              } @else {
                Confirmar Pagamento
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
}
