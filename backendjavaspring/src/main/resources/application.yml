spring:
  application:
    name: ${APPLICATION_NAME}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    jpa:
      repositories:
        enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    ssl:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.data.jpa: info
    # org.hibernate.SQL: debug  # Comentado: logs SQL desabilitados para reduzir ruído nos logs
    # org.hibernate.type.descriptor.sql.BasicBinder: trace  # Comentado: logs de parâmetros SQL desabilitados

brand:
  name: "Dashboard Autor Editora VL"
  frontend-url: "https://www.paineldavia.com.br"
  logo-url: "https://www.andescoresoftware.com.br" # troque aqui quando quiser

application:
  jwt:
    secret: ${JWT_SECRET}
  brand:
    name: ${BRAND_NAME:Painel do Autor da Editora Via Litterarum}
    logo-url: "https://www.andescoresoftware.com.br/AndesCore.jpg"
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://www.paineldavia.com.br}
  confirmation:
    minutes: 45 # expiração do token
    cooldown-seconds: 60 # intervalo mínimo entre reenvios
    max-per-day: 5 # teto diário por dia
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    id: ${ADMIN_ID:admin-1}

export:
  grpc:
    enabled: ${EXPORT_GRPC_ENABLED}
    host: ${EXPORT_GRPC_HOST}
    port: ${EXPORT_GRPC_PORT}

efi:
  pix:
    client-id: ${EFI_CLIENT_ID}
    client-secret: ${EFI_CLIENT_SECRET}
    chave: ${EFI_PIX_KEY}
    cert-path: classpath:pro-ecommerce.p12
    cert-password: "" # preencha se houver senha
    sandbox: false

# NOTA: As credenciais do banco de dados do e-commerce são configuradas por usuário
# através dos campos: ecommerce_db_url, ecommerce_db_username, ecommerce_db_password
# na tabela users. Não são necessárias variáveis de ambiente globais.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:painel-autor-backend}
      environment: production
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
      headers:
        Authorization: ${OTEL_BASE}
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
        headers:
          Authorization: ${OTEL_BASE}
        step: 30s

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    display-request-duration: true
    try-it-out-enabled: true
